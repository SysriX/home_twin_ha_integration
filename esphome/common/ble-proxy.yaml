# =============================================================================
# Gemeinsames Paket für ALLE BLE-Proxys (Home Twin Indoor-Ortung)
# =============================================================================
# Jeder Proxy ist eine kurze Datei, die nur Name/Raum/Schlüssel setzt und dieses
# Paket einbindet – siehe ../fl-ble-01.yaml als Vorlage.
#
# Der Proxy wertet selbst NICHTS aus: ESPHome reicht jedes Advertisement
# komplett (alle Frames, RSSI) an Home Assistant weiter. Dekodierung (iBeacon,
# Eddystone, BlueCharm KSensor/System …) und Ortung macht die Integration
# home_twin zentral – neue Frame-Typen brauchen also kein Neu-Flashen.
#
# Board: ZY-ESP32E / ESP32-WROOM-32E (esp32dev). Für andere Boards in der
# Proxy-Datei `board:` per Substitution überschreiben.
# Position im Grundriss: im Home-Twin-Editor als Gerät "BLE-Proxy" platzieren.
# =============================================================================

substitutions:
  board: esp32dev

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${area}
  comment: "BLE-Proxy Home Twin – ${area}"

esp32:
  board: ${board}
  framework:
    type: esp-idf          # von ESPHome für Bluetooth-Proxy empfohlen

logger:

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password}

captive_portal:

# Dauer-Scan: Fenster = Intervall -> Funk hört 100 % der Zeit zu
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms

bluetooth_proxy:
  active: true

button:
  - platform: restart
    name: Neustart

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic
